<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Patitas Felices</title>
    <link rel="stylesheet" href="../css/styles.css">


</head>
<body>

<header class="header">
    <img src="../imagenes/logo.png" alt="Logo Fundación" class="logo">
    <h1 class="titulo">Fundación Patitas Felices</h1>
</header>

<section class="contacto">
    <h2>Contáctanos</h2>

    <form class="formulario">
        <label>Nombre <span class="obligatorio">*</span></label>
        <input type="text" required pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ ]+">

        <label>Apellidos <span class="obligatorio">*</span></label>
        <input type="text" required pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ ]+">

        <label>Ciudad <span class="obligatorio">*</span></label>
        <input type="text" required>


        <label>Correo electrónico</label>
        <input type="email" required>
        <label for="dominio">Dominio *</label>
        <select id="dominio" name="dominio" required>
            <option value="" disabled selected>Selecciona tu dominio</option>
            <option value="@gmail.com">@gmail.com</option>
            <option value="@hotmail.com">@hotmail.com</option>
            <option value="@yahoo.com">@yahoo.com</option>
        </select>


        <label>Indicativo <span class="obligatorio">*</span></label>
<select required>
    <option value="+57">🇨🇴 +57 Colombia</option>
    <option value="+1">🇺🇸 +1 Estados Unidos</option>
    <option value="+52">🇲🇽 +52 México</option>
    <option value="+54">🇦🇷 +54 Argentina</option>
    <option value="+56">🇨🇱 +56 Chile</option>
    <option value="+34">🇪🇸 +34 España</option>
    <option value="+51">🇵🇪 +51 Perú</option>
    <option value="+593">🇪🇨 +593 Ecuador</option>
    <option value="+595">🇵🇾 +595 Paraguay</option>
    <option value="+598">🇺🇾 +598 Uruguay</option>
</select>

        <label>Teléfono (opcional)</label>
        <input type="text" inputmode="numeric" pattern="[0-9]+" placeholder="Solo números">


        <label>Tipo de consulta <span class="obligatorio">*</span></label>
        <select required>
            <option>Adopción</option>
            <option>Donación</option>
            <option>Voluntariado</option>
            <option>Información general</option>
            <option>Otro</option>
        </select>


        <label>Mensaje</label>
        <textarea rows="5" required></textarea>

        <button class="btn" type="submit">Enviar</button>
    </form>
</section>

<footer class="footer">
    <p>Fundación Patitas Felices • 2025</p>
</footer>

</body>
</html>
